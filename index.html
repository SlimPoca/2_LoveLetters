<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our NFC Love Journal 💕</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

    <!-- Libraries: Canvas Confetti, Tone.js audio synth, FontAwesome -->
    <script src="https://cdn.jsdelivr.com/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase App (Compat) & Realtime Database (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        .font-romantic { font-family: 'Dancing Script', cursive; }
        .font-handwriting { font-family: 'Caveat', cursive; }
        .font-heading { font-family: 'Playfair Display', serif; }
        .font-body { font-family: 'Quicksand', sans-serif; }

        /* Themes */
        body.theme-sakura {
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 50%, #ffb3c1 100%);
        }
        body.theme-midnight {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
        }
        body.theme-vintage {
            background: linear-gradient(135deg, #fefae0 0%, #f3e9dc 50%, #dda15e 100%);
        }

        /* Card styles */
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(229, 115, 115, 0.2);
        }
        .theme-midnight .glass-card {
            background: rgba(30, 27, 75, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* Typewriter Cursor */
        .typing-cursor::after {
            content: '💗';
            animation: blink 0.8s infinite;
            margin-left: 4px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Envelope Animations */
        .envelope-wrapper { perspective: 1000px; }
        .envelope-flap {
            transform-origin: top center;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .envelope-open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 0;
        }

        /* Floating background elements */
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
        .bg-particle {
            position: fixed;
            pointer-events: none;
            animation: floatUp 12s linear infinite;
            z-index: 0;
        }
    </style>
</head>
<body class="theme-sakura font-body min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 transition-all duration-700">

    <!-- Dynamic Background Particle Container -->
    <div id="particle-container" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- Header Navigation Bar -->
    <header class="relative z-20 w-full max-w-xl mx-auto flex justify-between items-center py-2 px-4 rounded-full bg-white/70 backdrop-blur-md shadow-sm border border-white/50 mb-4">
        <div class="flex items-center gap-2">
            <span class="text-xl">💌</span>
            <span class="font-bold text-rose-500 text-sm tracking-wide">NFC Love Notes</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="nav-mode-btn" class="text-xs bg-rose-100 hover:bg-rose-200 text-rose-700 font-semibold px-3 py-1.5 rounded-full transition flex items-center gap-1">
                <i class="fa-solid fa-pen-to-square"></i> <span id="nav-mode-text">Write Letter</span>
            </button>
        </div>
    </header>

    <main class="relative z-10 w-full max-w-xl mx-auto my-auto flex flex-col items-center">

        <!-- ================= STAGE 1: READ - ENVELOPE ================= -->
        <div id="envelope-stage" class="envelope-wrapper w-full cursor-pointer transition-all duration-500 hover:scale-[1.02]">
            <div id="envelope" class="relative w-full bg-rose-100/90 rounded-3xl p-8 border-2 border-rose-200 shadow-2xl flex flex-col items-center justify-center min-h-[360px] text-center overflow-hidden">
                <div class="envelope-flap absolute top-0 inset-x-0 h-36 bg-rose-200/90 rounded-b-full border-b-2 border-rose-300 shadow-sm flex items-end justify-center pb-3">
                    <div class="w-12 h-12 rounded-full bg-rose-500 text-white flex items-center justify-center shadow-lg text-lg">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                </div>
                <div class="mt-20 z-10 space-y-3">
                    <span class="inline-block px-4 py-1 rounded-full bg-white/80 text-rose-600 text-xs font-bold tracking-wider uppercase shadow-sm">
                        Tap To Open
                    </span>
                    <h1 id="envelope-recipient" class="font-romantic text-4xl sm:text-5xl text-rose-600 font-bold">
                        For Inayah ❤️
                    </h1>
                    <p id="envelope-sender-preview" class="text-sm text-gray-500 italic">A special love letter awaits inside...</p>
                </div>
            </div>
        </div>

        <!-- ================= STAGE 2: READ - LETTER DISPLAY ================= -->
        <div id="letter-stage" class="hidden w-full">
            <div class="glass-card rounded-3xl p-6 sm:p-10 shadow-2xl relative overflow-hidden transition-all duration-700">
                
                <!-- Audio & Music Bar -->
                <div class="flex justify-between items-center pb-4 border-b border-rose-200/50 mb-6 text-xs sm:text-sm">
                    <div class="flex items-center space-x-2 text-rose-500 font-semibold">
                        <i class="fa-regular fa-calendar-heart"></i>
                        <span id="letter-date">Today</span>
                    </div>

                    <div class="flex items-center space-x-2 bg-white/80 px-3 py-1.5 rounded-full border border-rose-100 shadow-sm">
                        <button id="music-toggle-btn" class="flex items-center gap-1.5 text-rose-500 hover:text-rose-600 text-xs font-semibold">
                            <i id="music-icon" class="fa-solid fa-music"></i>
                            <span id="music-text">Music</span>
                        </button>
                        <span class="text-rose-200">|</span>
                        <button id="sound-toggle-btn" class="text-rose-500">
                            <i id="sound-icon" class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                </div>

                <!-- Recipient Header -->
                <h2 id="letter-salutation" class="font-heading text-2xl sm:text-3xl text-rose-600 font-semibold mb-4">
                    Dearest Inayah,
                </h2>

                <!-- Animated Typewriter Body -->
                <div id="typewriter-body" class="font-handwriting text-2xl sm:text-3xl leading-relaxed min-h-[160px] whitespace-pre-wrap typing-cursor"></div>

                <!-- Letter Footer Sign-off & Actions -->
                <div id="letter-footer" class="mt-8 pt-6 border-t border-rose-200/50 flex flex-col sm:flex-row items-center justify-between gap-4 opacity-0 transition-opacity duration-700">
                    <div>
                        <p class="text-xs text-gray-400 uppercase tracking-widest font-bold">With all my love,</p>
                        <p id="letter-sender" class="font-romantic text-3xl sm:text-4xl text-rose-600 font-bold mt-0.5">Partner</p>
                    </div>

                    <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                        <button id="replay-btn" class="px-4 py-2 rounded-full bg-white/80 text-rose-600 hover:bg-rose-100 transition text-xs font-semibold flex items-center gap-1.5 border border-rose-200">
                            <i class="fa-solid fa-rotate-right"></i> Replay
                        </button>
                        <button id="reply-btn" class="px-5 py-2.5 rounded-full bg-gradient-to-r from-rose-500 to-pink-500 text-white font-bold text-sm shadow-lg hover:scale-105 transition flex items-center gap-2">
                            <i class="fa-solid fa-reply"></i> Write Back / Reply
                        </button>
                    </div>
                </div>

                <div id="skip-wrapper" class="mt-4 flex justify-end">
                    <button id="skip-btn" class="text-xs text-rose-400 hover:text-rose-600 underline font-semibold transition flex items-center gap-1">
                        <i class="fa-solid fa-bolt"></i> Fast forward typing
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= STAGE 3: WRITE / EDITOR MODE ================= -->
        <div id="editor-stage" class="hidden w-full">
            <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl relative space-y-5">
                <div class="flex items-center justify-between pb-3 border-b border-rose-200/50">
                    <h2 class="font-heading text-xl sm:text-2xl font-bold text-rose-600 flex items-center gap-2">
                        <span>✨ Compose NFC Love Letter</span>
                    </h2>
                    <span class="text-xs bg-rose-100 text-rose-700 px-3 py-1 rounded-full font-bold">Firebase Synced</span>
                </div>

                <!-- Target Tag Selector -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Save Letter To Tag:</label>
                    <select id="target-tag-select" class="w-full px-4 py-2 rounded-xl bg-white/80 border border-rose-200 focus:outline-none focus:ring-2 focus:ring-rose-400 text-sm font-semibold text-gray-800">
                        <option value="tag1">Tag #1 (Inayah's Tag)</option>
                        <option value="tag2">Tag #2 (Your Tag)</option>
                    </select>
                </div>

                <!-- Theme Selector -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Choose Aesthetic Theme</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="setTheme('sakura')" class="py-2 px-3 rounded-xl border border-rose-200 bg-rose-50 text-rose-600 text-xs font-bold flex items-center justify-center gap-1 shadow-sm">
                            🌸 Sakura
                        </button>
                        <button type="button" onclick="setTheme('midnight')" class="py-2 px-3 rounded-xl border border-indigo-900 bg-slate-900 text-indigo-300 text-xs font-bold flex items-center justify-center gap-1 shadow-sm">
                            🌙 Midnight
                        </button>
                        <button type="button" onclick="setTheme('vintage')" class="py-2 px-3 rounded-xl border border-amber-300 bg-amber-50 text-amber-800 text-xs font-bold flex items-center justify-center gap-1 shadow-sm">
                            📜 Vintage
                        </button>
                    </div>
                </div>

                <!-- Recipient & Sender Inputs -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">To (Recipient Name)</label>
                        <input id="input-recipient" type="text" value="Inayah" class="w-full px-4 py-2 rounded-xl bg-white/80 border border-rose-200 focus:outline-none focus:ring-2 focus:ring-rose-400 text-sm font-semibold text-gray-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">From (Sender Name)</label>
                        <input id="input-sender" type="text" value="Your Partner" class="w-full px-4 py-2 rounded-xl bg-white/80 border border-rose-200 focus:outline-none focus:ring-2 focus:ring-rose-400 text-sm font-semibold text-gray-800">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Date String</label>
                    <input id="input-date" type="text" value="February 14, 2026" class="w-full px-4 py-2 rounded-xl bg-white/80 border border-rose-200 focus:outline-none focus:ring-2 focus:ring-rose-400 text-sm font-semibold text-gray-800">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Your Love Letter Message</label>
                    <textarea id="input-body" rows="6" class="w-full p-4 rounded-xl bg-white/80 border border-rose-200 focus:outline-none focus:ring-2 focus:ring-rose-400 text-sm font-medium leading-relaxed text-gray-800" placeholder="Write your heartfelt letter here..."></textarea>
                </div>

                <!-- Save Actions -->
                <div class="pt-2 space-y-3">
                    <button id="save-firebase-btn" type="button" class="w-full py-3 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-500 text-white font-bold text-sm shadow-lg hover:opacity-95 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Save Letter Live To Selected Tag
                    </button>
                    
                    <div class="flex gap-2">
                        <button id="preview-letter-btn" type="button" class="w-full py-2.5 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold text-xs transition flex items-center justify-center gap-1.5 shadow-sm">
                            <i class="fa-solid fa-eye"></i> Preview Interactive Letter
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="relative z-10 mt-6 text-center text-xs opacity-75 font-semibold">
        Shared NFC Digital Love Journal 💕
    </footer>

    <!-- Logic Script -->
    <script>
        // Firebase Configuration & Initialization
        const firebaseConfig = {
            apiKey: "AIzaSyDMDE3P3QS3xTGfBjGy5rDrr21Fe7-cYJg",
            authDomain: "nfc-love-letters.firebaseapp.com",
            databaseURL: "https://nfc-love-letters-default-rtdb.firebaseio.com",
            projectId: "nfc-love-letters",
            storageBucket: "nfc-love-letters.firebasestorage.app",
            messagingSenderId: "148410159492",
            appId: "1:148410159492:web:232dcbefe4b3a735fe0dd1"
        };

        let db = null;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.database();
        } catch(e) {
            console.error("Firebase init failed:", e);
        }

        // Get tag ID from URL (?id=tag1 or ?id=tag2)
        const urlParams = new URLSearchParams(window.location.search);
        const currentTagId = urlParams.get('id') || 'tag1';

        // Default State Data
        const DEFAULT_LETTER = {
            recipient: "Inayah",
            sender: "Your Loving Partner",
            date: "February 14, 2026",
            body: "My dearest Inayah,\n\nFrom the moment you entered my life, every day has felt brighter and warmer. Thank you for being my constant smile, my best friend, and my favorite person.\n\nI made this NFC love letter just for you. Whenever you tap your phone to your NFC tag, you will read my heart.\n\nI love you endlessly! 💕",
            theme: "sakura"
        };

        let currentLetter = { ...DEFAULT_LETTER };
        let activeTheme = "sakura";
        let isAudioMuted = false;
        let isMusicPlaying = false;
        let typeSynth = null;
        let bgSynth = null;
        let bgLoop = null;
        let typingIndex = 0;
        let typingTimer = null;

        // Theme Changer
        function setTheme(themeName) {
            activeTheme = themeName;
            currentLetter.theme = themeName;
            document.body.className = `theme-${themeName} font-body min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 transition-all duration-700`;
        }

        // Floating particle renderer
        function renderParticles() {
            const container = document.getElementById('particle-container');
            container.innerHTML = '';
            const symbols = activeTheme === 'midnight' ? ['⭐', '✨', '🌙', '💫'] : ['❤️', '🌸', '💖', '💕'];
            
            for (let i = 0; i < 18; i++) {
                const p = document.createElement('div');
                p.className = 'bg-particle text-lg sm:text-2xl';
                p.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = (Math.random() * 8 + 6) + 's';
                p.style.animationDelay = (Math.random() * 4) + 's';
                container.appendChild(p);
            }
        }

        // Audio initialization (Tone.js)
        function initAudio() {
            try {
                if (typeSynth) return;
                typeSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.01,
                    octaves: 2,
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.05 }
                }).toDestination();
                typeSynth.volume.value = -18;

                bgSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.8, decay: 1.5, sustain: 0.6, release: 2 }
                }).toDestination();
                bgSynth.volume.value = -24;

                const chords = [["C4", "E4", "G4", "B4"], ["A3", "C4", "E4", "G4"], ["F3", "A3", "C4", "E4"], ["G3", "B3", "D4", "F4"]];
                let cIdx = 0;
                bgLoop = new Tone.Loop((time) => {
                    if (isMusicPlaying) {
                        bgSynth.triggerAttackRelease(chords[cIdx], "2n", time);
                        cIdx = (cIdx + 1) % chords.length;
                    }
                }, "1m");
                Tone.Transport.bpm.value = 65;
            } catch(e){}
        }

        function playClickSound() {
            if (!isAudioMuted && typeSynth && Tone.context.state === 'running') {
                const notes = ["C5", "E5", "G5", "A5"];
                typeSynth.triggerAttackRelease(notes[Math.floor(Math.random() * notes.length)], "32n");
            }
        }

        function toggleMusic(force) {
            isMusicPlaying = force !== undefined ? force : !isMusicPlaying;
            const icon = document.getElementById('music-icon');
            const text = document.getElementById('music-text');
            if (isMusicPlaying) {
                if (Tone.context.state !== 'running') Tone.start();
                Tone.Transport.start();
                if (bgLoop) bgLoop.start(0);
                icon.className = "fa-solid fa-compact-disc animate-spin text-rose-500";
                text.textContent = "Playing";
            } else {
                if (bgLoop) bgLoop.stop();
                icon.className = "fa-solid fa-music text-rose-400";
                text.textContent = "Music";
            }
        }

        // View Navigation Switches
        function showStage(stage) {
            document.getElementById('envelope-stage').classList.add('hidden');
            document.getElementById('letter-stage').classList.add('hidden');
            document.getElementById('editor-stage').classList.add('hidden');

            const navBtnText = document.getElementById('nav-mode-text');

            if (stage === 'envelope') {
                document.getElementById('envelope-stage').classList.remove('hidden');
                navBtnText.textContent = "Write / Edit Letter";
            } else if (stage === 'letter') {
                document.getElementById('letter-stage').classList.remove('hidden');
                navBtnText.textContent = "Write / Edit Letter";
            } else if (stage === 'editor') {
                document.getElementById('editor-stage').classList.remove('hidden');
                navBtnText.textContent = "View Received Letter";
                populateEditorFields();
            }
        }

        // Typewriter Engine
        function startTypewriter() {
            const bodyElem = document.getElementById('typewriter-body');
            const footerElem = document.getElementById('letter-footer');
            const skipWrapper = document.getElementById('skip-wrapper');

            bodyElem.textContent = "";
            bodyElem.classList.add('typing-cursor');
            typingIndex = 0;
            skipWrapper.classList.remove('hidden');
            footerElem.classList.add('opacity-0', 'pointer-events-none');

            const text = currentLetter.body;

            function typeChar() {
                if (typingIndex < text.length) {
                    const char = text.charAt(typingIndex);
                    bodyElem.textContent += char;
                    if (char.trim() !== '') playClickSound();
                    typingIndex++;
                    typingTimer = setTimeout(typeChar, 40);
                } else {
                    finishTypewriter();
                }
            }
            typeChar();
        }

        function finishTypewriter() {
            if (typingTimer) clearTimeout(typingTimer);
            document.getElementById('typewriter-body').textContent = currentLetter.body;
            document.getElementById('typewriter-body').classList.remove('typing-cursor');
            document.getElementById('skip-wrapper').classList.add('hidden');
            
            const footer = document.getElementById('letter-footer');
            footer.classList.remove('opacity-0', 'pointer-events-none');

            confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } });
        }

        // Form & Editor Sync
        function populateEditorFields() {
            document.getElementById('input-recipient').value = currentLetter.recipient;
            document.getElementById('input-sender').value = currentLetter.sender;
            document.getElementById('input-date').value = currentLetter.date;
            document.getElementById('input-body').value = currentLetter.body;
        }

        function updateLetterFromEditor() {
            currentLetter.recipient = document.getElementById('input-recipient').value || "Inayah";
            currentLetter.sender = document.getElementById('input-sender').value || "Partner";
            currentLetter.date = document.getElementById('input-date').value || "Today";
            currentLetter.body = document.getElementById('input-body').value || "";
            currentLetter.theme = activeTheme;
        }

        // Save letter directly to Firebase Database
        async function saveLetterToFirebase() {
            updateLetterFromEditor();
            const targetTag = document.getElementById('target-tag-select').value;
            
            if (db) {
                try {
                    await db.ref('letters/' + targetTag).set(currentLetter);
                    alert(`✨ Success! Saved letter live to ${targetTag.toUpperCase()} in Firebase!`);
                } catch(err) {
                    alert("Error saving to Firebase: " + err.message);
                }
            } else {
                alert("Firebase database connection error.");
            }
        }

        // Load letter from Firebase on start
        function loadLetterFromFirebase() {
            if (db) {
                db.ref('letters/' + currentTagId).once('value').then((snapshot) => {
                    if (snapshot.exists()) {
                        currentLetter = snapshot.val();
                        setTheme(currentLetter.theme || "sakura");
                        renderParticles();

                        document.getElementById('envelope-recipient').textContent = `For ${currentLetter.recipient} ❤️`;
                        document.getElementById('letter-salutation').textContent = `Dearest ${currentLetter.recipient},`;
                        document.getElementById('letter-date').textContent = currentLetter.date;
                        document.getElementById('letter-sender').textContent = currentLetter.sender;
                    }
                }).catch((err) => {
                    console.log("Reading from Firebase failed:", err);
                });
            }
        }

        // App Initialization
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('target-tag-select').value = currentTagId;

            setTheme(currentLetter.theme || "sakura");
            renderParticles();

            // Load live letter from Firebase based on ?id=tag1 or ?id=tag2
            loadLetterFromFirebase();

            // Populate Read Views
            document.getElementById('envelope-recipient').textContent = `For ${currentLetter.recipient} ❤️`;
            document.getElementById('letter-salutation').textContent = `Dearest ${currentLetter.recipient},`;
            document.getElementById('letter-date').textContent = currentLetter.date;
            document.getElementById('letter-sender').textContent = currentLetter.sender;

            // Envelope Tap Handler
            document.getElementById('envelope-stage').addEventListener('click', () => {
                Tone.start();
                initAudio();
                document.getElementById('envelope').classList.add('envelope-open');
                setTimeout(() => {
                    showStage('letter');
                    toggleMusic(true);
                    startTypewriter();
                }, 600);
            });

            // Nav Mode Toggle Button
            document.getElementById('nav-mode-btn').addEventListener('click', () => {
                const editorVisible = !document.getElementById('editor-stage').classList.contains('hidden');
                if (editorVisible) {
                    showStage('envelope');
                } else {
                    showStage('editor');
                }
            });

            // Interactive Reply Button (Automatically Swaps Recipient/Sender!)
            document.getElementById('reply-btn').addEventListener('click', () => {
                const previousRecipient = currentLetter.recipient;
                const previousSender = currentLetter.sender;
                
                // Target the opposite tag for reply
                const replyTarget = currentTagId === 'tag1' ? 'tag2' : 'tag1';
                document.getElementById('target-tag-select').value = replyTarget;

                // Swap names for quick response
                currentLetter.recipient = previousSender;
                currentLetter.sender = previousRecipient;
                currentLetter.body = `My dearest ${previousSender},\n\nI scanned your love letter and it made my heart overflow! 💕\n\n`;

                showStage('editor');
            });

            // Editor Actions
            document.getElementById('preview-letter-btn').addEventListener('click', () => {
                updateLetterFromEditor();
                document.getElementById('envelope-recipient').textContent = `For ${currentLetter.recipient} ❤️`;
                document.getElementById('letter-salutation').textContent = `Dearest ${currentLetter.recipient},`;
                document.getElementById('letter-date').textContent = currentLetter.date;
                document.getElementById('letter-sender').textContent = currentLetter.sender;
                showStage('letter');
                startTypewriter();
            });

            document.getElementById('save-firebase-btn').addEventListener('click', saveLetterToFirebase);

            // Replay & Skip
            document.getElementById('skip-btn').addEventListener('click', finishTypewriter);
            document.getElementById('replay-btn').addEventListener('click', startTypewriter);

            // Audio Toggles
            document.getElementById('sound-toggle-btn').addEventListener('click', () => {
                isAudioMuted = !isAudioMuted;
                document.getElementById('sound-icon').className = isAudioMuted ? "fa-solid fa-volume-xmark text-gray-400" : "fa-solid fa-volume-high text-rose-500";
            });
            document.getElementById('music-toggle-btn').addEventListener('click', () => toggleMusic());

            // Default Stage Display
            showStage('envelope');
        });
    </script>
</body>
</html>
